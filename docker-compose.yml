services:
  postgres:
    image: postgres:16
    container_name: finjourney
    environment:
      POSTGRES_DB: finjourney
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - finjourney-data:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: finjourney-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: fm6848445@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  finjourney-data:
  
